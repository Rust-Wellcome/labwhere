[package]
name = "labwhere"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1.11.1"
once_cell = "1.20.3"
tokio = { version = "1.43.0", features = ["full"] }
sqlx = { version = "0.8.3", features = [ "runtime-tokio", "sqlite", "macros" ] }
hyper = "1.6.0"
http-body-util = "0.1.2"
hyper-util = { version = "0.1", features = ["full"] }
env_logger = "0.11.5"
log = "0.4.26"
http-body = "1.0.1"
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
serde_yml = "0.0.12"
